services:

postgres:
image: postgres:16
container_name: orderflow-postgres

```
restart: unless-stopped

environment:
  POSTGRES_DB: ${POSTGRES_DB:-orderflow}
  POSTGRES_USER: ${POSTGRES_USER:-orderflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}

ports:
  - "${POSTGRES_PORT:-5433}:5432"

volumes:
  - postgres_data:/var/lib/postgresql/data

healthcheck:
  test:
    [
      "CMD-SHELL",
      "pg_isready -U ${POSTGRES_USER:-orderflow} -d ${POSTGRES_DB:-orderflow}"
    ]
  interval: 10s
  timeout: 5s
  retries: 5
```

volumes:
postgres_data:
