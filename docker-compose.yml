services:

  postgres:
    image: postgres:16
    container_name: orderflow-postgres

    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - orderflow_postgres_data:/var/lib/postgresql/data

volumes:
  orderflow_postgres_data:
