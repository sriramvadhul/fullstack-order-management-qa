name: OrderFlow CI

on:
push:
branches:
- main
- develop

pull_request:
branches:
- main

jobs:

backend-tests:

```
runs-on: ubuntu-latest

services:
  postgres:
    image: postgres:16

    env:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow

    ports:
      - 5432:5432

    options: >-
      --health-cmd "pg_isready -U orderflow -d orderflow"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5

steps:

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: maven

  - name: Run backend tests
    working-directory: backend
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/orderflow
      SPRING_DATASOURCE_USERNAME: orderflow
      SPRING_DATASOURCE_PASSWORD: orderflow
    run: mvn test
```
