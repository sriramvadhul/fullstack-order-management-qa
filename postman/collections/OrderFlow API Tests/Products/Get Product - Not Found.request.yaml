$kind: http-request
url: "{{baseUrl}}/api/products/999999"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 404\", function () {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Response is JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Status field is 404\", function () {\r

      \    pm.expect(response.status).to.eql(404);\r

      });\r

      \r

      pm.test(\"Error is Not Found\", function () {\r

      \    pm.expect(response.error).to.eql(\"Not Found\");\r

      });\r

      \r

      pm.test(\"Correct error message is returned\", function () {\r

      \    pm.expect(response.message)\r

      \        .to.eql(\"Product not found with id: 999999\");\r

      });"
    language: text/javascript
order: 4499198398170886
